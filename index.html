

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1> Wordly</h1>
    <p>Your simple online dictionary</p>
  </header>

  <main>
    <form id="search-form">
      <label for="word-input">Search for a word</label>
      <div class="search-box">
        <input
          type="text"
          id="word-input"
          placeholder="Enter a word..."
          required
          aria-label="Enter a word to search"
        >
        <button type="submit">Search</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="results" aria-label="Dictionary results" hidden>
      <h2 id="word"></h2>
      <p id="phonetic"></p>
      <button id="audio-button" type="button" hidden>
         Play pronunciation
      </button>

      <h3>Definitions</h3>
      <div id="definitions"></div>

      <h3>Synonyms</h3>
      <div id="synonyms"></div>
    </section>
  </main>

  <footer>
    <p>Wordly &copy; 2026 | Powered by Free Dictionary API</p>
  </footer>
</body>
</html>


  <script src="script.js"></script>
</body>
</html>
