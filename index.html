<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Wordly Dictionary</h1>
    <p>Discover words, meanings, and pronunciation.</p>

    <button id="theme" type="button"> Change Theme</button>

    <form id="searchForm">
      <label for="word">Search for a word</label>
      <div class="search-box">
        <input id="word" type="text" placeholder="e.g. beautiful"
          aria-label="Enter an English word" required>
        <button id="searchButton" type="submit">Search</button>
      </div>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <section id="result" aria-label="Dictionary results"></section>

    <section>
      <h2> My Favorite Words</h2>
      <ul id="favorites"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
